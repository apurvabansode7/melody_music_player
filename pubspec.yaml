name: melody_music_player
description: Flutter music player using the Jamendo API.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  bloc_concurrency: ^0.2.5
  equatable: ^2.0.5
  dio: ^5.4.3+1
  just_audio: ^0.9.40
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.3
  flutter_dotenv: ^5.1.0
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env